spring.application.name=vegan-food-backend
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vegan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.google.client-id=${GOOGLE_CLIENT_ID:${REACT_APP_GOOGLE_CLIENT_ID:}}
app.frontend.base-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.bootstrap.owner-email=${BOOTSTRAP_OWNER_EMAIL:}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD:}

api.payosapi.key=${PAYOS_API_URL:https://api-merchant.payos.vn/v2/payment-requests}
api.clientid.key=${PAYOS_CLIENT_ID:${CLIENT_ID:}}
api.apikey.key=${PAYOS_API_KEY:${API_KEY:}}
api.checksumkey.key=${PAYOS_CHECKSUM_KEY:}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.veganfood.veganfoodbackend=INFO
